name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: npm install

      - name: Build Vue Frontend
        run: npm run build

      - name: Init Tauri iOS
        run: npx tauri ios init

      - name: [核心修复 1] 手动编译 Rust 为 iOS 静态库
        # 绕开 Xcode，我们自己用标准的 cargo 命令编译 Rust 代码
        run: |
          cd src-tauri
          cargo build --release --target aarch64-apple-ios

      - name: [核心修复 2] Xcode 免签打包 (跳过坑人脚本)
        run: |
          cd src-tauri/gen/apple
          
          # 告诉 Xcode 绝对不要运行 Tauri 那个会崩溃的脚本
          export TAURI_SKIP_DEVSCRIPTS=true
          
          # 开始强行免签编译
          xcodebuild clean build \
            -project bilscore.xcodeproj \
            -scheme bilscore_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$(pwd)/build/Release-iphoneos
            
          # 提取并打包 IPA
          mkdir -p Payload
          
          # 自动寻找编译出来的 .app 文件（防止大小写命名问题导致找不到文件）
          APP_NAME=$(ls build/Release-iphoneos | grep .app | head -n 1)
          cp -r "build/Release-iphoneos/$APP_NAME" Payload/
          
          zip -r bilscore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-unsigned-ipa
          path: src-tauri/gen/apple/bilscore.ipa