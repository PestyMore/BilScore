name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: npm install

      - name: Build Vue Frontend
        run: npm run build

      - name: Init Tauri iOS
        run: npx tauri ios init

      - name: Patch Xcode Project (物理阉割签名限制)
        # 核心魔法：使用 sed 命令强行修改 Xcode 工程底层的配置文件
        # 把自动签名改为手动，并清空所有开发者团队要求，骗过 Xcode 的预检查
        run: |
          cd src-tauri/gen/apple/bilscore.xcodeproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = ".*";/DEVELOPMENT_TEAM = "";/g' project.pbxproj

      - name: Build App via Tauri
        # 给底层环境注入全局免签变量，配合上面的修改，Xcode 就会乖乖编译出完整的 App
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: npx tauri ios build --target aarch64 || true

      - name: Package into IPA
        run: |
          mkdir -p Payload
          
          echo "🔍 正在寻找编译好的 .app 文件..."
          APP_PATH=$(find src-tauri/gen/apple -type d -name "*.app" | grep -v "Debug" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：未能找到 .app 文件！"
            exit 1
          fi
          
          echo "✅ 成功找到 App: $APP_PATH"
          echo "📦 正在打包 IPA..."
          cp -r "$APP_PATH" Payload/
          zip -r bilscore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-unsigned-ipa
          path: bilscore.ipa