name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: npm install

      - name: Build Vue Frontend
        run: npm run build

      - name: Init Tauri iOS
        run: npx tauri ios init

      - name: Prepare iOS Assets
        # 这一步非常重要：让 Tauri 帮你把网页打包进 iOS 工程，并编译 Rust 核心。
        # 它最后会因为没有苹果证书而报错退出，但我们加了 `|| true`，让它报错也继续往下走！
        run: npx tauri ios build --target aarch64-apple-ios || true

      - name: Build Unsigned IPA via Xcode
        # 使用苹果原生命令强行闭屏签名检查，打包出纯净版 IPA
        run: |
          cd src-tauri/gen/apple
          
          xcodebuild clean build \
            -project bilscore.xcodeproj \
            -scheme bilscore_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$(pwd)/build/Release-iphoneos
            
          mkdir -p Payload
          cp -r build/Release-iphoneos/bilscore.app Payload/
          zip -r bilscore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-unsigned-ipa
          path: src-tauri/gen/apple/bilscore.ipa