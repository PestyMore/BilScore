name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: npm install

      - name: Build Vue Frontend
        run: npm run build

      - name: Init Tauri iOS
        run: npx tauri ios init

      - name: Build App via Tauri (Inject Unsigned Args)
        # 核心魔法：使用官方 Tauri 命令，通过 `--` 将免签指令和输出路径强行注入给 Xcode。
        # Tauri 服务器正常运行，绝不报错！
        run: |
          mkdir -p build-output
          npx tauri ios build --target aarch64-apple-ios -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$(pwd)/build-output || true

      - name: Package into IPA
        # 自动提取生成的 .app 并打包为我们需要的 .ipa 安装包
        run: |
          mkdir -p Payload
          
          # 寻找刚才生成的 app 文件
          APP_PATH=$(find build-output -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：未找到生成的 .app 文件，编译失败！"
            exit 1
          fi
          
          echo "✅ 成功找到 App: $APP_PATH，正在打包 IPA..."
          cp -r "$APP_PATH" Payload/
          zip -r bilscore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-unsigned-ipa
          path: bilscore.ipa