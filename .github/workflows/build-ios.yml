name: Build iOS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建版本：public（通用）或 personal（内置规则）'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - personal
      sign:
        description: '是否使用仓库 Secrets 进行真机签名（否则输出未签名 IPA，供本地签名工具侧载）'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS (${{ inputs.mode || 'public' }})
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 26 / iOS 26 SDK 把 Swift 兼容库移出了默认链接搜索路径，还引入了
      # SwiftUICore 隐式链接限制。runner 若预装 Xcode 16 就优先用它，避免踩新 SDK 的坑。
      - name: Select a Tauri-compatible Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -n 1)
          if [ -n "$XCODE" ]; then
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
            echo "使用 $XCODE"
          else
            echo "::warning::runner 未预装 Xcode 16，沿用默认 Xcode；由下一步注入 Swift 库搜索路径兜底"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Frontend Deps
        run: npm ci

      # Vite 只从 .env 文件读取 VITE_* 变量，直接写 env: 无效，必须落盘
      - name: Write Build Mode
        run: echo "VITE_APP_MODE=${{ inputs.mode || 'public' }}" > .env

      - name: Init Tauri iOS
        run: npx tauri ios init

      # libapp.a 里的 Swift 对象强引用 libswiftCompatibility56 / Concurrency，
      # 链接器需要在 toolchain 的 usr/lib/swift/iphoneos 下找到它们。
      - name: Patch Swift compatibility library search paths
        run: python3 scripts/patch-ios-project.py

      # ---- 签名准备：只有勾选 sign 且 Secret 齐全时才执行 ----
      - name: Import Code Signing Certs
        if: ${{ inputs.sign }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install Provisioning Profile
        if: ${{ inputs.sign }}
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/bilscore.mobileprovision"

      - name: Configure Manual Signing
        if: ${{ inputs.sign }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd src-tauri/gen/apple/bilscore.xcodeproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = \"[^\"]*\";/DEVELOPMENT_TEAM = $TEAM_ID;/g" project.pbxproj

      - name: Build App (signed)
        if: ${{ inputs.sign }}
        run: npx tauri ios build --target aarch64

      # 未签名路径：产出 .app 后手工打成 IPA，供本地签名工具侧载
      - name: Build App (unsigned)
        if: ${{ !inputs.sign }}
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          cd src-tauri/gen/apple/bilscore.xcodeproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = ".*";/DEVELOPMENT_TEAM = "";/g' project.pbxproj
          cd "$GITHUB_WORKSPACE"
          npx tauri ios build --target aarch64

      - name: Package IPA
        run: |
          # xcodebuild 的产物在 DerivedData，不一定落在 gen/apple 下
          APP_PATH=$(find src-tauri/gen/apple -type d -name "*.app" ! -path "*Debug*" -print -quit)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path "*release-iphoneos/*.app" -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "*.app" ! -path "*Debug*" -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 产物，构建失败"
            echo "--- gen/apple 目录（诊断用）---"
            find src-tauri/gen/apple -maxdepth 4 -type d | head -n 60
            exit 1
          fi
          echo "找到 App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          # 未签名产物不应带任何签名材料，交给本地工具重新签
          rm -rf Payload/*/_CodeSignature Payload/*/embedded.mobileprovision
          zip -qr bilscore.ipa Payload
          echo "IPA 大小: $(du -h bilscore.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-ios-${{ inputs.mode || 'public' }}-${{ inputs.sign && 'signed' || 'unsigned' }}
          path: bilscore.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bilscore.ipa
          generate_release_notes: false
