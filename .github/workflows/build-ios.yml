name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: npm install

      - name: Build Vue Frontend
        run: npm run build

      - name: Init Tauri iOS
        run: npx tauri ios init

      - name: Build App via Tauri (Let it fail at signing)
        # 核心逻辑：正常调用官方构建命令。
        # 它会在最后签名阶段因为没有证书而报错，但此时 app 已经编译完成了。
        # 我们用 '|| true' 让流程忽略这个报错，继续往下走去提取 app。
        run: npx tauri ios build --target aarch64-apple-ios || true

      - name: Package into IPA
        run: |
          mkdir -p Payload
          
          echo "🔍 正在寻找编译好的 .app 文件..."
          # .app 在 macOS 中其实是一个文件夹，所以用 -type d 寻找
          APP_PATH=$(find src-tauri/gen/apple -type d -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：未能找到 .app 文件！可能是前面的 Rust 编译阶段出了严重错误。"
            echo "--- 输出 build 目录结构供排错 ---"
            ls -R src-tauri/gen/apple/build || true
            exit 1
          fi
          
          echo "✅ 成功找到 App: $APP_PATH"
          echo "📦 正在打包 IPA..."
          cp -r "$APP_PATH" Payload/
          zip -r bilscore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-unsigned-ipa
          path: bilscore.ipa