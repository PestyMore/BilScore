name: Build iOS IPA (No Mac Needed)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Rust 环境
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: 安装前端依赖
        run: npm install

      - name: 构建 Vue 前端
        run: npm run build

      - name: 初始化 Tauri iOS 工程
        run: npx tauri ios init

      - name: 构建 Tauri iOS (预期会因签名失败报错，这一步会编译 Rust 代码)
        run: npx tauri ios build --target aarch64-apple-ios
        continue-on-error: true

      - name: 强制去除签名并生成 IPA 安装包
        run: |
          cd src-tauri/gen/apple
          
          xcodebuild clean build \
            -project bilscore.xcodeproj \
            -scheme bilscore_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$(pwd)/build/Release-iphoneos
            
          mkdir -p Payload
          cp -r build/Release-iphoneos/bilscore.app Payload/
          zip -r bilscore.ipa Payload

      - name: 上传生成的 IPA 提供下载
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-unsigned-ipa
          path: src-tauri/gen/apple/bilscore.ipa