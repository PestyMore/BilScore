name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: npm install

      - name: Build Vue Frontend
        run: npm run build

      - name: Fix Xcode Path
        # 核心修复：Xcode 脚本会丢失环境变量，我们强制把 node 和 cargo 链接到公共目录
        run: |
          sudo ln -s $(which node) /usr/local/bin/node
          sudo ln -s $(which npm) /usr/local/bin/npm
          sudo ln -s $(which cargo) /usr/local/bin/cargo
          sudo ln -s $(which rustc) /usr/local/bin/rustc

      - name: Init Tauri iOS
        run: npx tauri ios init

      - name: Build Unsigned IPA via Xcodebuild
        # 让 Xcode 正常编译，但强行关闭签名检查
        run: |
          cd src-tauri/gen/apple
          
          xcodebuild clean build \
            -project bilscore.xcodeproj \
            -scheme bilscore_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$(pwd)/build/Release-iphoneos
            
          mkdir -p Payload
          
          # 自动寻找编译出来的 .app 文件夹并复制
          APP_PATH=$(find build/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          
          zip -r bilscore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-unsigned-ipa
          path: src-tauri/gen/apple/bilscore.ipa