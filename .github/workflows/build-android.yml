name: Build Android

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建版本：public（通用）或 personal（内置规则）'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - personal
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # tag 构建一次产出两版；手动触发只跑所选的那一版
      matrix:
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.mode) || '["public","personal"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # 两个 mode 的 Rust 产物完全一致，共享缓存避免重复编译
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: bilscore-android-release

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # setup-android@v3 内部会执行 `sdkmanager tools`，而新版 cmdline-tools 已移除
      # 这个废弃包并以退出码 1 失败。runner 自带 SDK，这里直接安装编译真正需要的组件。
      - name: Setup Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)
          if [ -z "$SM" ]; then
            echo "::error::未找到 sdkmanager"
            exit 1
          fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36"
          # NDK 单独装：部分 runner 已预装或由 Gradle 自行解析，失败不直接中断
          "$SM" --install "ndk;29.0.14206865" || echo "::warning::NDK 未通过 sdkmanager 安装，交由 Gradle 解析"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -d "$SDK/ndk/29.0.14206865" ]; then
            echo "ANDROID_NDK_HOME=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Frontend Deps
        run: npm ci

      # Vite 只从 .env 文件读取 VITE_* 变量，直接写 env: 无效，必须落盘
      - name: Write Build Mode
        run: echo "VITE_APP_MODE=${{ matrix.mode }}" > .env

      - name: Check signing secret
        id: sig
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      # 未配置正式签名时，缓存自签名密钥，保证后续版本可以直接覆盖安装而不丢本地数据
      - name: Restore self-signed keystore
        if: steps.sig.outputs.has_secret == 'false'
        id: ks
        uses: actions/cache@v4
        with:
          path: src-tauri/gen/android/app/bilscore.jks
          key: bilscore-selfsigned-keystore-v1

      - name: Prepare release signing
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HAS_SECRET: ${{ steps.sig.outputs.has_secret }}
          KS_HIT: ${{ steps.ks.outputs.cache-hit }}
        run: |
          APP=src-tauri/gen/android/app
          mkdir -p "$APP"
          if [ "$HAS_SECRET" = "true" ]; then
            echo "$KS_BASE64" | base64 -d > "$APP/bilscore.jks"
            STORE_PASS="$KS_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            ALIAS="$KEY_ALIAS"
            echo "使用仓库 Secret 中的签名"
          else
            STORE_PASS="bilscore-release"
            KEY_PASS="bilscore-release"
            ALIAS="bilscore"
            if [ "$KS_HIT" != "true" ] || [ ! -f "$APP/bilscore.jks" ]; then
              echo "生成自签名密钥"
              keytool -genkeypair -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -keystore "$APP/bilscore.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
                -dname "CN=BilScore, OU=Mobile, O=BilScore, L=NA, ST=NA, C=US" > /dev/null 2>&1 \
                || { echo "::error::生成自签名密钥失败"; exit 1; }
            else
              echo "复用缓存中的自签名密钥（可覆盖安装）"
            fi
          fi
          cat > src-tauri/gen/android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$ALIAS
          storeFile=bilscore.jks
          EOF

      # 只出 APK：AAB 仅供应用商店，本项目直接分发 APK；--split-per-abi 让每个包只带一个架构
      - name: Build APK
        run: npx tauri android build --apk --split-per-abi

      # 只把真机架构的可安装包送进 Release，x86 系列留在 artifact 供调试
      - name: Collect distributable APKs
        env:
          TAG: ${{ github.ref_name }}
          MODE: ${{ matrix.mode }}
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk
          OUT=dist-release
          mkdir -p "$OUT"
          copy_apk() {
            abi="$1"; label="$2"
            src=$(find "$APK_DIR" -type f -name "app-${abi}-release*.apk" ! -name "*unaligned*" -print -quit 2>/dev/null || true)
            if [ -z "$src" ]; then
              echo "::warning::未找到 ${label} 版 APK"
              return
            fi
            cp "$src" "$OUT/BilScore-${TAG}-${MODE}-${label}.apk"
            echo "${label}: $(du -h "$src" | cut -f1)"
          }
          copy_apk arm64 arm64
          copy_apk arm armv7
          ls -lh "$OUT"
          if [ -z "$(ls -A "$OUT")" ]; then
            echo "::error::没有可用的 APK 产物"
            find "$APK_DIR" -type f -name '*.apk' | head -n 20
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilscore-android-${{ matrix.mode }}-${{ github.ref_name }}
          path: |
            dist-release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.apk
          generate_release_notes: false
