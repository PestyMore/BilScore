name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Frontend + Rust core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # cargo test 会链接 Tauri 的 Linux 依赖，干净 runner 上必须预装
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Deps
        run: npm ci

      - name: Check version consistency
        run: |
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(p.version!==t.version){console.error('版本号不一致:',p.version,t.version);process.exit(1)}console.log('版本号一致:',p.version)"

      - name: Build frontend (types + production bundle)
        run: npm run build

      - name: SSR smoke (all routes + icon data)
        run: npm run smoke

      - name: Rust core unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
