<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <!-- viewport-fit=cover 必须要有，否则 iOS 上 env(safe-area-inset-*) 恒为 0，刘海和底部横条会挡住内容 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BilScore · 台球计分器</title>
    <style>
      /* 加载占位：如果它一直没消失，说明 JS 根本没跑起来（比纯白屏好排查） */
      #boot-hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        color: #8e8e93;
        background: #1c1c1e;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="boot-hint">正在加载 BilScore…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
