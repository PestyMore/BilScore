<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- BilScore 应用图标源：8 号球。
       用纯几何图形（不用 <text>），因为 tauri icon 走 resvg，字体不一定可用。
       球体只占中心约 78%，四周留白，避免被 Android 自适应图标裁掉。 -->
  <defs>
    <radialGradient id="ball" cx="35%" cy="27%" r="82%">
      <stop offset="0%" stop-color="#4a536a"/>
      <stop offset="55%" stop-color="#191c26"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="200" fill="url(#ball)"/>
  <circle cx="256" cy="256" r="96" fill="#f7f8fc"/>
  <g fill="none" stroke="#191c26" stroke-width="20">
    <circle cx="256" cy="205" r="30"/>
    <circle cx="256" cy="292" r="38"/>
  </g>
</svg>
