[package]
name = "bilscore"
version = "2.0.1"
description = "BilScore billiards scorekeeper"
authors = ["you"]
edition = "2021"

[lib]
name = "bilscore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }

# 移动端产物体积与启动速度优化
[profile.release]
opt-level = "s"        # 优先体积（想要极致性能可改 3）
lto = true             # 链接期优化，APK 明显变小
strip = true           # 去掉符号表
codegen-units = 1      # 单 codegen unit，配合 lto 效果最好
panic = "abort"        # 去掉 unwind 表
